services:
  app-setlist:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=${BASE_URL:-}
      - APP_URL=${APP_URL:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_SECURE=false
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - data:/app/data
    restart: unless-stopped

volumes:
  data:
